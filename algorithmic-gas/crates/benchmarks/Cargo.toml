[package]
name = "algorithmic-gas-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["cpu", "parallel"]
cpu = ["algorithmic-gas/cpu"]
parallel = ["algorithmic-gas/parallel"]
wgpu = ["algorithmic-gas/wgpu"]
cuda = ["algorithmic-gas/cuda"]

[dependencies]
algorithmic-gas = { path = "../algorithmic-gas", default-features = false }
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true
futures-lite.workspace = true
num-bigint = "0.4"
num-traits = "0.2"
flate2 = "1.1.10"
sha2 = "0.10.9"

[dev-dependencies]
futures-lite.workspace = true
ciborium.workspace = true
