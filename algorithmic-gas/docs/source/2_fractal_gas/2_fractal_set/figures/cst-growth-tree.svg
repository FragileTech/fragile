<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="CST forest of persistent walker paths across timesteps">
  <defs>
    <marker id="arrow-cst" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3a556a" />
    </marker>
    <style>
      .title { fill: #102a43; font-size: 20px; font-weight: 600; font-family: Arial, Helvetica, sans-serif; }
      .axis { stroke: #333333; stroke-width: 2; }
      .grid { stroke: #c7c7c7; stroke-width: 1; stroke-dasharray: 6 6; }
      .edge { stroke: #3a556a; stroke-width: 2.4; marker-end: url(#arrow-cst); }
      .node { fill: #2a9d8f; stroke: #1d4f4a; stroke-width: 1.5; }
      .label { fill: #111111; font-size: 16px; font-family: Arial, Helvetica, sans-serif; }
      .legend-text { fill: #111111; font-size: 14px; font-family: Arial, Helvetica, sans-serif; }
      .legend-box { fill: #ffffff; stroke: #c0c0c0; stroke-width: 1; }
      .note { fill: #444444; font-size: 14px; font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="540" fill="#ffffff" />
  <text class="title" x="110" y="38">CST forest: persistent walker paths</text>

  <line class="axis" x1="80" y1="470" x2="80" y2="60" />
  <path d="M80 50 L70 68 L90 68 Z" fill="#333333" />
  <text class="label" x="20" y="55">t (future)</text>

  <line class="grid" x1="110" y1="420" x2="620" y2="420" />
  <line class="grid" x1="110" y1="320" x2="620" y2="320" />
  <line class="grid" x1="110" y1="220" x2="620" y2="220" />
  <line class="grid" x1="110" y1="120" x2="620" y2="120" />

  <text class="label" x="40" y="426">t0</text>
  <text class="label" x="40" y="326">t1</text>
  <text class="label" x="40" y="226">t2</text>
  <text class="label" x="40" y="126">t3</text>

  <!-- CST preserves the walker ID, so every path is non-branching. -->
  <line class="edge" x1="180" y1="420" x2="180" y2="320" />
  <line class="edge" x1="180" y1="320" x2="180" y2="220" />
  <line class="edge" x1="180" y1="220" x2="180" y2="120" />
  <line class="edge" x1="310" y1="420" x2="310" y2="320" />
  <line class="edge" x1="310" y1="320" x2="310" y2="220" />
  <line class="edge" x1="310" y1="220" x2="310" y2="120" />
  <line class="edge" x1="440" y1="420" x2="440" y2="320" />
  <line class="edge" x1="440" y1="320" x2="440" y2="220" />
  <line class="edge" x1="440" y1="220" x2="440" y2="120" />
  <line class="edge" x1="570" y1="420" x2="570" y2="320" />
  <line class="edge" x1="570" y1="320" x2="570" y2="220" />
  <line class="edge" x1="570" y1="220" x2="570" y2="120" />

  <circle class="node" cx="180" cy="420" r="10" />
  <circle class="node" cx="180" cy="320" r="10" />
  <circle class="node" cx="180" cy="220" r="10" />
  <circle class="node" cx="180" cy="120" r="10" />
  <circle class="node" cx="310" cy="420" r="10" />
  <circle class="node" cx="310" cy="320" r="10" />
  <circle class="node" cx="310" cy="220" r="10" />
  <circle class="node" cx="310" cy="120" r="10" />
  <circle class="node" cx="440" cy="420" r="10" />
  <circle class="node" cx="440" cy="320" r="10" />
  <circle class="node" cx="440" cy="220" r="10" />
  <circle class="node" cx="440" cy="120" r="10" />
  <circle class="node" cx="570" cy="420" r="10" />
  <circle class="node" cx="570" cy="320" r="10" />
  <circle class="node" cx="570" cy="220" r="10" />
  <circle class="node" cx="570" cy="120" r="10" />

  <text class="note" x="140" y="75">A CST edge links the same walker ID at consecutive times.</text>
  <text class="note" x="140" y="95">Clone genealogy is separate; a killed walker terminates its CST path.</text>
  <text class="label" x="166" y="452">p</text>
  <text class="label" x="296" y="452">q</text>
  <text class="label" x="426" y="452">r</text>
  <text class="label" x="556" y="452">s</text>

  <rect class="legend-box" x="650" y="120" width="200" height="150" rx="8" />
  <circle class="node" cx="670" cy="150" r="7" />
  <text class="legend-text" x="685" y="155">episode n_i,t</text>
  <line class="edge" x1="662" y1="185" x2="705" y2="185" />
  <text class="legend-text" x="715" y="190">CST edge</text>
  <text class="legend-text" x="662" y="220">same walker ID</text>
  <text class="legend-text" x="662" y="242">future directed</text>
</svg>
