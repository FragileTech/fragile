<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>fractal gas autotest - swarm map arrays</title></head>
<body>
<pre id="result">RUNNING</pre>
<script type="module">
// Smoke test of the per-walker swarm arrays feeding the level-map overlay:
// walkerX/walkerY/walkerWorld/walkerStage/walkerAlive must be present, have
// N entries, and hold sane SMB values (x >= 0, world/stage 1-indexed).
//   google-chrome --headless=new --virtual-time-budget=60000 \
//     --dump-dom http://localhost:8000/web/autotest-swarm.html | grep -A3 result
const out = document.getElementById("result");
const report = (text) => {
  out.textContent = text;
  fetch("autotest-result-" + encodeURIComponent(text)).catch(() => {});
};
const fail = (msg) => report("FAIL " + msg);

const N = 24;
try {
  if (!crossOriginIsolated) throw new Error("not crossOriginIsolated");
  const rom = await (await fetch("test-rom.nes")).arrayBuffer();
  if (rom.byteLength < 16) throw new Error("test-rom.nes missing");

  const worker = new Worker("worker.js", { type: "module" });
  let iters = 0;
  worker.onmessage = (event) => {
    const msg = event.data;
    if (msg.type === "error") return fail(msg.message);
    if (msg.type === "ready") return worker.postMessage({ type: "start" });
    if (msg.type === "step") {
      iters += 1;
      if (iters < 10) return;
      worker.postMessage({ type: "pause" });
      const s = msg.stats;
      for (const key of ["walkerX", "walkerY", "walkerWorld", "walkerStage",
                         "walkerAlive"]) {
        if (!s[key] || s[key].length !== N) {
          return fail(`${key} missing or wrong length: ${s[key]?.length}`);
        }
      }
      const xOk = s.walkerX.every((x) => Number.isFinite(x) && x >= 0);
      const wOk = s.walkerWorld.every((w) => w >= 1 && w <= 8) &&
                  s.walkerStage.every((st) => st >= 1 && st <= 4);
      const bestX = s.walkerX[s.bestWalkerIdx];
      // After 10 iterations the best walker must have moved off x=40 spawn.
      const ok = xOk && wOk && bestX > 0;
      report((ok ? "OK" : "FAIL") +
        ` iter=${s.iteration} bestX=${bestX}` +
        ` xRange=[${Math.min(...s.walkerX)},${Math.max(...s.walkerX)}]` +
        ` alive=${s.walkerAlive.filter(Boolean).length}/${N}`);
    }
  };
  worker.onerror = (e) => fail("worker: " + e.message);
  worker.postMessage(
    { type: "init", rom, params: {
        n: N, distCoef: 1.0, rewardCoef: 1.0, useCumulativeReward: true,
        dtMin: 1, dtMax: 4, nElite: 2, seed: 7, nThreads: 4, obsMode: 0,
        world: 1, stage: 1, console: 0, game: 0 } },
    [rom],
  );
} catch (err) {
  fail(String(err));
}
</script>
</body>
</html>
