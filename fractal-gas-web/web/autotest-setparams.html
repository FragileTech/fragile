<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>setparams autotest</title></head><body>
<pre id="result">RUNNING</pre>
<script type="module">
// Regression: setParams mid-run must not throw (embind requires all
// FgParams fields; worker.js fills the farm fields).
const report = (t) => { document.getElementById("result").textContent = t;
  fetch("autotest-result-" + encodeURIComponent(t)).catch(() => {}); };
try {
  const rom = await (await fetch("test-rom.nes")).arrayBuffer();
  const worker = new Worker("worker.js", { type: "module" });
  let steps = 0, tweaked = false;
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === "error") return report("SETPARAMS-FAIL " + m.message);
    if (m.type === "ready") return worker.postMessage({ type: "start" });
    if (m.type === "step") {
      steps = m.stats.iteration;
      if (steps === 3 && !tweaked) {
        tweaked = true;
        worker.postMessage({ type: "setParams", params: {
          n: 16, distCoef: 1.5, rewardCoef: 2.0, useCumulativeReward: true,
          dtMin: 1, dtMax: 4, nElite: 2, seed: 7, nThreads: 4, obsMode: 0,
          world: 1, stage: 1, console: 0, game: 0 } });
      }
      if (steps >= 8) {
        worker.postMessage({ type: "pause" });
        report("SETPARAMS-OK iter=" + steps);
      }
    }
  };
  worker.postMessage({ type: "init", rom, params: {
    n: 16, distCoef: 1.0, rewardCoef: 1.0, useCumulativeReward: true,
    dtMin: 1, dtMax: 4, nElite: 2, seed: 7, nThreads: 4, obsMode: 0,
    world: 1, stage: 1, console: 0, game: 0 } }, [rom]);
} catch (err) { report("SETPARAMS-FAIL " + String(err)); }
</script></body></html>
