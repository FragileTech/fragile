<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>atari autotest</title></head>
<body>
<pre id="result">RUNNING</pre>
<script type="module">
// End-to-end check of the Atari console path in wasm: bundled Breakout rom,
// pthread-parallel ALE instances, 5 gas steps.
const out = document.getElementById("result");
const report = (text) => {
  out.textContent = text;
  fetch("autotest-result-" + encodeURIComponent(text)).catch(() => {});
};
try {
  if (!crossOriginIsolated) throw new Error("not crossOriginIsolated");
  const romR = await fetch("roms/atari/breakout.bin");
  if (!romR.ok) throw new Error("roms/atari/breakout.bin not bundled");
  const rom = await romR.arrayBuffer();
  const worker = new Worker("worker.js", { type: "module" });
  const steps = [];
  let frameBytes = 0;
  let frameW = 0;
  let frameH = 0;
  worker.onmessage = (event) => {
    const msg = event.data;
    if (msg.type === "error") return report("ATARI-FAIL " + msg.message);
    if (msg.type === "ready") return worker.postMessage({ type: "start" });
    if (msg.type === "step") {
      steps.push(msg.stats);
      if (msg.frame) {
        frameBytes = msg.frame.byteLength;
        frameW = msg.frameWidth;
        frameH = msg.frameHeight;
      }
      if (steps.length >= 5) {
        worker.postMessage({ type: "pause" });
        const last = steps[steps.length - 1];
        const ok = last.iteration >= 5 &&
                   Number.isFinite(last.meanVirtualReward) &&
                   Number.isFinite(last.numRevived) &&
                   frameW > 0 && frameBytes === frameW * frameH * 4 &&
                   last.world === undefined;  // NES-only stat absent
        report((ok ? "ATARI-OK" : "ATARI-FAIL") +
          ` iter=${last.iteration} alive=${last.aliveCount}` +
          ` frame=${frameW}x${frameH}`);
      }
    }
  };
  worker.onerror = (e) => report("ATARI-FAIL worker: " + e.message);
  worker.postMessage(
    { type: "init", rom, params: {
        n: 16, distCoef: 1.0, rewardCoef: 1.0, useCumulativeReward: true,
        dtMin: 1, dtMax: 4, nElite: 2, seed: 7, nThreads: 4, obsMode: 0,
        world: 1, stage: 1, console: 1, game: 0 } },
    [rom],
  );
} catch (err) {
  report("ATARI-FAIL " + String(err));
}
</script>
</body>
</html>
