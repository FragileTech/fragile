name: Deploy Pages (wasm demo + docs)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt pytest

      - name: Generate prompt downloads
        run: make prompt

      - name: Check documentation sources and routes
        run: python -m pytest --confcutdir=tests/docs -q tests/docs/

      - name: Build Theory documentation
        run: jupyter-book build docs/ --config "$GITHUB_WORKSPACE/docs/_config.yml" --toc "$GITHUB_WORKSPACE/docs/_toc.yml" --path-output docs/_build/theory-site

      - name: Build Lab documentation
        run: jupyter-book build docs/ --config "$GITHUB_WORKSPACE/docs/_config_lab.yml" --toc "$GITHUB_WORKSPACE/docs/_toc_lab.yml" --path-output docs/_build/lab-site

      - name: Assemble documentation portal
        run: python docs/assemble_docs.py

      - name: Test documentation routes and redirects
        run: |
          test -s docs/_build/html/index.html
          test -s docs/_build/html/theory/index.html
          test -s docs/_build/html/lab/index.html
          test -s docs/_build/html/source/1_agent/intro_agent.html
          test -s docs/_build/html/source/project/control_laboratory.html
          test -s docs/_build/html/_static/prompts/1_agent-with-proofs.md

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

  # The fractal gas wasm demo (NES / Atari / Genesis swarm) served at the
  # site root. COOP/COEP on GitHub Pages is provided client-side by
  # web/coi-serviceworker.min.js (Pages cannot set response headers).
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with emulator submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache

      - name: Build zlib port
        run: embuilder build zlib

      - name: Build wasm
        working-directory: fractal-gas-web
        run: |
          emcmake cmake -B build-wasm
          cmake --build build-wasm -j"$(nproc)"

      - name: Bundle ROMs
        working-directory: fractal-gas-web
        run: |
          # Every ROM ships ENCRYPTED: web/roms-enc/** is committed (built
          # with `FG_ROM_PASSWORD=... node tools/encrypt-rom.mjs --all`, one
          # password for Mario, Sonic, Montezuma and the Atari picker) and
          # decrypted in the visitor's browser. No plaintext ROM is copied
          # into the artifact — that would bypass the password gate.
          ls -l web/roms-enc web/roms-enc/atari | head -20
          # Airstriker rom is copied to web/ by the wasm build itself.

      - name: Upload arcade artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-web
          path: |
            fractal-gas-web/web
            !fractal-gas-web/web/lab/**
            !fractal-gas-web/web/optimization/**
          if-no-files-found: error

  # Build the lab explicitly, without emulator submodules or incidental outputs
  # from the arcade's CMake build. Both native adapters must ship together.
  build-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fractal-gas-web/package-lock.json

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache

      - name: Build both lab engines and assets
        run: make control-web

      - name: Test lab state and recording contracts
        run: npm --prefix fractal-gas-web run test:lab

      - name: Install browser for Pages smoke test
        working-directory: fractal-gas-web
        run: npx playwright install --with-deps chromium

      - name: Test a Pages-style project URL without isolation headers
        run: node fractal-gas-web/tests/control-pages-browser.mjs

      - name: Upload lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-lab
          path: fractal-gas-web/web/lab
          if-no-files-found: error

  build-optimization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fractal-gas-web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
      - name: Build Optimization Lab without emulator submodules
        run: make optimization-web
      - name: Verify WASM and recording contracts
        run: npm --prefix fractal-gas-web run test:optimization
      - uses: actions/upload-artifact@v4
        with:
          name: optimization-lab
          path: fractal-gas-web/web/optimization
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-docs, build-wasm, build-lab, build-optimization]
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-web
          path: site

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: site/docs

      - name: Download lab artifact
        uses: actions/download-artifact@v4
        with:
          name: control-lab
          path: site/lab

      - name: Download Optimization Lab artifact
        uses: actions/download-artifact@v4
        with:
          name: optimization-lab
          path: site/optimization

      - name: Verify complete Pages bundle
        run: |
          test -s site/index.html
          test -s site/docs/index.html
          test -s site/docs/theory/index.html
          test -s site/docs/theory/intro.html
          test -s site/docs/theory/searchindex.js
          test -s site/docs/lab/index.html
          test -s site/docs/lab/searchindex.js
          test -s site/docs/source/1_agent/intro_agent.html
          test -s site/docs/_static/prompts/1_agent-with-proofs.md
          for guide in control_laboratory control_lab_getting_started control_lab_tasks control_lab_task_harvest control_lab_task_ants control_lab_task_tandem control_lab_task_mining control_lab_task_rocket control_lab_task_racing control_lab_controls control_lab_scenes control_lab_scene_reference control_lab_replay control_lab_experiments control_lab_architecture; do
            test -s "site/docs/lab/source/project/$guide.html"
            test -s "site/docs/source/project/$guide.html"
          done
          test -s site/coi-serviceworker.min.js
          test -s site/optimization/index.html
          test -s site/optimization/engine/optimization.mjs
          test -s site/optimization/engine/optimization.wasm
          test -s site/optimization/vendor/three.module.js
          test -s site/docs/lab/source/project/optimization_laboratory.html
          test -s site/lab/binary.js
          test -s site/lab/index.html
          test -s site/lab/engine/control.mjs
          test -s site/lab/engine/control.wasm
          test -s site/lab/engine/control-threaded.mjs
          test -s site/lab/engine/control-threaded.wasm
          test -s site/lab/vendor/three.module.js
          test -s site/lab/vendor/three.core.js
          test -s site/lab/scenarios/racing.json
          test -s site/lab/branding/logo.png
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
