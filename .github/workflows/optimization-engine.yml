name: Optimization Lab
on:
  push:
    branches: [main]
    paths: ['fractal-gas-web/**', 'src/fragile/fractalai/core/**', 'tests/fractalai/test_optimization_engine.py', 'tests/test_benchmarks.py', 'Makefile', '.github/workflows/optimization-engine.yml']
  pull_request:
    paths: ['fractal-gas-web/**', 'src/fragile/fractalai/core/**', 'tests/fractalai/test_optimization_engine.py', 'tests/test_benchmarks.py', 'Makefile', '.github/workflows/optimization-engine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: make optimization-native
      - run: ctest --test-dir fractal-gas-web/build-optimization-native --output-on-failure
      - name: Verify Python objective and BAOAB parity
        env:
          PYTHONPATH: src
        run: >-
          uv run --isolated --no-project --with pytest --with numpy --with torch
          --with panel --with holoviews --with numba --with einops --with scipy
          --with pydantic --with networkx --with gymnasium --with hydra-core
          pytest -q tests/test_benchmarks.py tests/fractalai/test_optimization_engine.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fractal-gas-web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
      - run: make optimization-native optimization-web
      - run: npm --prefix fractal-gas-web run test:optimization
      - name: Test browser interactions and project-prefixed paths
        timeout-minutes: 10
        # Match package-lock.json; keep Firefox and Mesa in one tested image.
        run: |
          mkdir -p "$RUNNER_TEMP/optimization-browser"
          docker run --rm --init --network none --shm-size=1g \
            --env LIBGL_ALWAYS_SOFTWARE=1 \
            --env OPTIMIZATION_FIREFOX_HEADLESS=0 \
            --env OPTIMIZATION_SCREENSHOTS=/artifacts/screenshots \
            --env OPTIMIZATION_SERVER_LOG=/artifacts/server.log \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$RUNNER_TEMP/optimization-browser:/artifacts" \
            --workdir /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash fractal-gas-web/tools/test-optimization-browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimization-browser-artifacts
          path: ${{ runner.temp }}/optimization-browser
