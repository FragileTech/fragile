name: Continuous control engine
on:
  push:
    paths: ['fractal-gas-web/**', 'src/fragile/fractalai/control/**', 'tests/fractalai/test_control_engine.py', '.github/workflows/control-engine.yml']
  pull_request:
    paths: ['fractal-gas-web/**', 'src/fragile/fractalai/control/**', 'tests/fractalai/test_control_engine.py', '.github/workflows/control-engine.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Compile and test custom physics
        run: |
          cmake -S fractal-gas-web -B fractal-gas-web/build-control-native -DFG_CONTROL_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build fractal-gas-web/build-control-native -j4
          ctest --test-dir fractal-gas-web/build-control-native --output-on-failure
      - name: Test Python batch bindings and existing gas integration
        env:
          PYTHONPATH: src
        run: uv run --no-project --with pytest --with numpy --with networkx --with torch --with pydantic pytest -q tests/fractalai/test_control_engine.py
      - name: Check Python style
        run: |
          uv run --no-project --with ruff ruff check src/fragile/fractalai/control tests/fractalai/test_control_engine.py
          uv run --no-project --with ruff ruff format --check src/fragile/fractalai/control tests/fractalai/test_control_engine.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fractal-gas-web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
      - name: Build both browser engines
        run: make control-web
      - name: Test WebAssembly state and recording contracts
        run: npm --prefix fractal-gas-web run test:lab
      - name: Install test browser
        working-directory: fractal-gas-web
        run: npx playwright install --with-deps chromium
      - name: Test the interactive laboratory
        run: |
          uv run --no-project python fractal-gas-web/tools/serve-control.py > /tmp/control-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8080/lab/ > /dev/null && break; sleep 1; done
          node fractal-gas-web/tests/control-browser.mjs
          node fractal-gas-web/tests/control-replay-browser.mjs
          node fractal-gas-web/tests/control-experiments-browser.mjs
          node fractal-gas-web/tests/control-racing-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-browser-artifacts
          path: |
            /tmp/fractal-control-browser
            /tmp/fractal-control-racing
