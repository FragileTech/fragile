name: Continuous control engine
on:
  push:
    paths:
      [
        "fractal-gas-web/**",
        "src/fragile/fractalai/control/**",
        "tests/fractalai/test_control_engine.py",
        "Makefile",
        "pyproject.toml",
        "conftest.py",
        ".github/workflows/control-engine.yml",
      ]
  workflow_dispatch:
  pull_request:
    paths:
      [
        "fractal-gas-web/**",
        "src/fragile/fractalai/control/**",
        "tests/fractalai/test_control_engine.py",
        "Makefile",
        "pyproject.toml",
        "conftest.py",
        ".github/workflows/control-engine.yml",
      ]
permissions:
  contents: read
concurrency:
  group: control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Compile and test custom physics
        run: |
          cmake -S fractal-gas-web -B fractal-gas-web/build-control-native -DFG_CONTROL_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build fractal-gas-web/build-control-native -j4
          ctest --test-dir fractal-gas-web/build-control-native --output-on-failure
      - name: Test Python batch bindings and existing gas integration
        env:
          PYTHONPATH: src
        # Existing gas imports also load the core tree/Panel configuration modules.
        run: >-
          uv run --isolated --no-project
          --with pytest --with numpy --with networkx --with torch --with pydantic
          --with 'gymnasium[atari]>=1.2.3' --with panel --with hydra-core
          --with scipy --with einops
          pytest -q tests/fractalai/test_control_engine.py
      - name: Check Python style
        run: |
          uv run --no-project --with ruff ruff check src/fragile/fractalai/control tests/fractalai/test_control_engine.py
          uv run --no-project --with ruff ruff format --check src/fragile/fractalai/control tests/fractalai/test_control_engine.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fractal-gas-web/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
      - name: Build both browser engines
        run: make control-web
      - name: Test WebAssembly state and recording contracts
        run: npm --prefix fractal-gas-web run test:lab
      - name: Install test browsers
        working-directory: fractal-gas-web
        run: npx playwright install --with-deps chromium firefox
      - name: Test native controls in Firefox and Chromium
        timeout-minutes: 5
        run: bash fractal-gas-web/tools/test-control-browser.sh node fractal-gas-web/tests/control-help-browser.mjs
      - name: Test the interactive laboratory
        timeout-minutes: 15
        run: bash fractal-gas-web/tools/test-control-browser.sh node fractal-gas-web/tests/control-browser.mjs
      - name: Test Wave Jump trajectories and checkpoints
        timeout-minutes: 10
        run: bash fractal-gas-web/tools/test-control-browser.sh node fractal-gas-web/tests/control-wave-jump-browser.mjs
      - name: Test mining hook controls
        timeout-minutes: 5
        run: bash fractal-gas-web/tools/test-control-browser.sh node fractal-gas-web/tests/control-hooks-browser.mjs
      - name: Test workspace settings and continuous driving
        timeout-minutes: 10
        run: bash fractal-gas-web/tools/test-control-browser.sh node fractal-gas-web/tests/control-workspace-browser.mjs
      - name: Test laboratory replay
        timeout-minutes: 15
        run: bash fractal-gas-web/tools/test-control-browser.sh node fractal-gas-web/tests/control-replay-browser.mjs
      - name: Test laboratory experiments
        timeout-minutes: 15
        run: bash fractal-gas-web/tools/test-control-browser.sh node fractal-gas-web/tests/control-experiments-browser.mjs
      - name: Test laboratory racing
        timeout-minutes: 15
        run: bash fractal-gas-web/tools/test-control-browser.sh node fractal-gas-web/tests/control-racing-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-browser-artifacts
          path: |
            /tmp/fractal-control-browser
            /tmp/fractal-control-racing
            /tmp/control-server.log
